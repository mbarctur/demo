
name: Demo builder

on:
  workflow_call:

concurrency:
  group: documentation
  cancel-in-progress: true

jobs:
  sphinx:
    uses: ./.github/workflows/build-sphinx.yml

  antora:
    uses: ./.github/workflows/build-antora.yml

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    needs:
      - sphinx
      - antora

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Combine user documentation
        uses: actions/download-artifact@v4
        with:
          name: user
          path: _site/user

      - name: Download API documentation
        uses: actions/download-artifact@v4
        with:
          name: api
          path: _site/api


      - name: Add documentation homepage
        run: cp docs/site/index.html _site/index.html

      - name: Upload documentation
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4



