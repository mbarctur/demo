
name: Demo builder

on:
  workflow_call:

concurrency:
  group: documentation
  cancel-in-progress: true

jobs:
  sphinx:
    uses: ./.github/workflows/build-sphinx.yml

  antora:
    uses: ./.github/workflows/build-antora.yml

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    needs:
      - sphinx
      - antora

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Combine API and user documentation
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: _site/
          merge-multiple: true

      - name: Add documentation homepage
        run: cp docs/site/index.html _site/index.html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4



